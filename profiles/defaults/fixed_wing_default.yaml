# ============================================================================
# DEFAULT FIXED-WING PROFILE
# ============================================================================
# Applies to: ArduPlane aircraft — single or twin engine, pusher or tractor.
#
# These are conservative, type-appropriate defaults used when no fleet-specific
# profile is supplied.  Motor channel and battery cell count are auto-detected
# from the log and will override the values here at runtime.
#
# HOW TO CREATE YOUR FLEET PROFILE:
#   1. Copy this file to profiles/MY_PLANE_001.yaml
#   2. Fill in values from your actual airframe specs and test data
#   3. Run: python cli.py analyze flight.bin --profile profiles/MY_PLANE_001.yaml
# ============================================================================

id: "fixed-wing-default"
name: "Fixed-Wing"
type: fixed_wing               # multirotor | fixed_wing | vtol

# ── Operational Expectations ─────────────────────────────────────────────────
# Fixed-wing aircraft have much longer endurance than multirotors.
# Set expected_endurance_min from your actual cruise-speed endurance test.
expected_endurance_min: 45     # Conservative default — update from test flights
expected_range_km: 30.0        # Typical fixed-wing operational range
max_payload_kg: 1.0            # Default payload capacity
max_speed_ms: 20.0             # Typical cruise speed (m/s) — adjust per airframe
max_altitude_m: 120.0          # Regulatory limit (adjust per local rules)

# ── Battery Configuration ─────────────────────────────────────────────────────
# cell_count is auto-detected from log voltage at runtime.
# Fixed-wing typically draws much lower average current than multirotors.
battery:
  capacity_mah: 5000           # Update to your actual pack capacity
  cell_count: 4                # Auto-detected from log — this is the fallback
  nominal_voltage: 14.8        # 4S nominal (auto-updated when cell count detected)
  full_voltage: 16.8           # 4S full charge (auto-updated when cell count detected)
  min_cell_voltage: 3.5        # Warning threshold per cell
  critical_cell_voltage: 3.3   # Failsafe threshold — risk of cell damage below this
  max_continuous_current_a: 30.0  # Fixed-wing draws much less — update from spec
  cycles_lifespan: 300         # Typical LiPo cycle life before retirement

# ── Motor / Throttle Configuration ───────────────────────────────────────────
# Fixed-wing has a single throttle channel. Symmetry analysis is skipped.
# Channel is auto-detected from the log.  C3 is the ArduPlane default.
motors:
  count: 1                     # Auto-detected from log — this is the fallback
  channels: [3]               # Auto-detected from log — ArduPlane default throttle
  max_pwm: 2000                # Standard ESC max PWM (µs)
  min_pwm: 1000                # Standard ESC min PWM (µs)
  hover_throttle_pct: 45       # Cruise throttle % — update from cruise test
  high_throttle_warn_pct: 85   # Above this sustained = headwind / overload warning
  high_throttle_critical_pct: 95  # Above this sustained = critical thrust saturation

# ── Vibration Thresholds ──────────────────────────────────────────────────────
# Fixed-wing airframes tolerate more vibration than multirotors.
# High vibration in fixed-wing usually indicates propeller imbalance or bearing wear.
vibration:
  warn_threshold: 20.0         # m/s² mean — higher tolerance than multirotor
  critical_threshold: 40.0     # m/s² mean — ground the aircraft
  clip_warn_per_min: 5         # IMU clipping events/min before warning

# ── GPS / Navigation ──────────────────────────────────────────────────────────
# Fixed-wing moves faster — GPS position jump tolerance is wider.
gps:
  min_satellites: 8            # Minimum acceptable satellite count
  max_hdop: 1.5                # Maximum acceptable HDOP
  min_fix_type: 3              # 3 = 3D Fix, 4 = DGPS, 6 = RTK Fixed
  max_position_jump_m: 15.0    # Wider than multirotor — faster speed = larger GPS steps

# ── Maintenance Schedule ──────────────────────────────────────────────────────
# Fixed-wing components generally last longer than multirotor — lower vibration loads.
maintenance:
  motor_hours: 300             # Motor inspection/replacement interval (hours)
  prop_cycles: 200             # Propeller replacement interval (flight cycles)
  battery_cycles: 300          # Battery retirement threshold (charge cycles)
  esc_hours: 300               # ESC inspection interval (hours)
  frame_inspection_hours: 50   # Structural inspection interval (hours)

# ── Scoring Weights ───────────────────────────────────────────────────────────
# Fixed-wing: battery and flight overview are most important (endurance).
# Motors weight is low — only one throttle channel, less diagnostic value.
# Airspeed health is more important than for multirotors.
# Must sum to 1.0
scoring_weights:
  battery: 0.12
  motors: 0.05
  flight_overview: 0.12
  sensors: 0.09
  vibration: 0.05
  control: 0.06
  efficiency: 0.05
  rc_link: 0.05
  landing_wind: 0.06
  fc_health: 0.04
  mission: 0.05
  airspeed: 0.05
  pid_tuning: 0.05
  power_rail: 0.04
  telemetry: 0.04
  esc_telemetry: 0.04
  altitude_control: 0.04

# ── Threshold Overrides ───────────────────────────────────────────────────────
# Uncomment to override module defaults for this profile.
# thresholds:
#   ctl_rms_warn_deg: 4.0         # Roll/Pitch RMS warning (fixed-wing default: 4.0°)
#   ctl_rms_critical_deg: 8.0     # Roll/Pitch RMS critical (fixed-wing default: 8.0°)
#   ctl_large_error_deg: 8.0      # Large attitude error threshold (default: 8.0°)
#   ctl_large_error_pct: 5.0      # % of flight with large error allowed (default: 5%)
#   ctl_osc_rms_warn: 4.0         # Oscillation RMS warning (default: 4.0°)
#   ctl_osc_rms_crit: 7.0         # Oscillation RMS critical (default: 7.0°)
#   mot_sat_warn_pct: 5.0         # Engine saturation warning % (default: 5%)
#   mot_sat_crit_pct: 15.0        # Engine saturation critical % (default: 15%)
